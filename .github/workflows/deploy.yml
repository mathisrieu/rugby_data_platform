
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build:
    name: Build + Smoke Test + Publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construire l'image Docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: rugby-data-stats:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: bash scripts/smoke_test_image.sh rugby-data-stats:${{ github.sha }}

      - name: Taille de l'image
        run: |
          size=$(docker image inspect rugby-data-stats:${{ github.sha }} --format '{{.Size}}')
          echo "Image : $((size / 1024 / 1024)) Mo" >> "$GITHUB_STEP_SUMMARY"

      - name: Déterminer le nom de l'image GHCR
        id: image
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/rugby-data-stats" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image sur GHCR
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ github.sha }}
        run: |
          docker tag "rugby-data-stats:${VERSION}" "${IMAGE}:sha-${VERSION}"
          docker tag "rugby-data-stats:${VERSION}" "${IMAGE}:latest"

          docker push "${IMAGE}:sha-${VERSION}"
          docker push "${IMAGE}:latest"
