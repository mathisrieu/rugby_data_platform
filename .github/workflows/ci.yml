name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # chaque lundi : détecte une dérive des dépendances ou du site scrapé
  workflow_dispatch:
  workflow_call: # réutilisé par release.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Installer ruff
        run: pip install -r requirements-lint.txt

      - name: Ruff
        run: ruff check --output-format=github src tests airflow/dags scripts

  test:
    name: Tests (pytest + DAGs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances (contraintes Airflow)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest
        run: pytest --cov --cov-report=xml

      - name: Résumé de couverture
        if: ${{ !cancelled() }}
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport de couverture
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DBT_PROFILES_DIR: dbt
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dbt.txt

      - name: Installer dbt
        run: pip install -r requirements-dbt.txt

      - name: Valider les modèles dbt
        run: dbt parse

  docker:
    name: Image Docker (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construire l'image (sans push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: rugby-data:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test de l'image
        run: bash scripts/smoke_test_image.sh rugby-data:ci

      - name: Taille de l'image
        run: |
          size=$(docker image inspect rugby-data:ci --format '{{.Size}}')
          echo "Image rugby-data:ci : $((size / 1024 / 1024)) Mo" >> "$GITHUB_STEP_SUMMARY"

  # Point d'entrée unique pour la protection de branche : exiger uniquement « CI OK ».
  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [lint, test, dbt, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le résultat des jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
