[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Les DAGs importent aussi bien `player_stats...` que `src.players_per_match...`
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.ruff]
target-version = "py312"
extend-exclude = ["other"]  # anciens scripts

[tool.ruff.lint]
# E4/E7/E9 + F : erreurs pycodestyle et pyflakes. I : tri des imports.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Le dossier airflow/ à la racine fait classer le paquet `airflow` en « first-party » :
# le tri d'imports n'a pas de sens dans les DAGs (les autres règles y restent actives).
"airflow/dags/*" = ["I001"]
